name: Verify core API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/create-local-tls.sh'
      - 'docs/api/**'
      - '.github/workflows/core-api.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/create-local-tls.sh'
      - 'docs/api/**'
      - '.github/workflows/core-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: xk_rotaract_test
          POSTGRES_USER: xk_test
          # Ephemeral CI-only credential; never used by a deployed service.
          POSTGRES_PASSWORD: ci-integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xk_test -d xk_rotaract_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/xk_rotaract_test
      DATABASE_USER: xk_test
      DATABASE_PASSWORD: ci-integration-only
      APP_ORIGIN: https://localhost:5173
      CORE_TEST_ALLOW_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Generate ephemeral local keys
        run: |
          printf 'IDEMPOTENCY_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'LOCAL_REVIEWER_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Validate API contract
        run: python3 docs/api/validate_contract.py
      - name: Verify against PostgreSQL 17
        working-directory: backend
        run: mvn --batch-mode verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify live HTTPS enrollment and account flows
        env:
          LIVE_REVIEWER_EMAIL: reviewer@example.test
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U xk_test xk_rotaract_live
          bash scripts/create-local-tls.sh
          DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/xk_rotaract_live SPRING_PROFILES_ACTIVE=local java -jar backend/target/core-api-0.6.0-SNAPSHOT.jar > "$RUNNER_TEMP/core-api.log" 2>&1 &
          core_api_pid=$!
          cd frontend
          VITE_API_MODE=live DEV_TLS_KEY="$GITHUB_WORKSPACE/.local/tls/key.pem" DEV_TLS_CERT="$GITHUB_WORKSPACE/.local/tls/cert.pem" npm run dev -- --strictPort > "$RUNNER_TEMP/core-frontend.log" 2>&1 &
          core_frontend_pid=$!
          trap 'kill "$core_api_pid" "$core_frontend_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 --fail --silent --output /dev/null http://127.0.0.1:8080/api/v1/csrf-token
          curl --cacert "$GITHUB_WORKSPACE/.local/tls/cert.pem" --retry 10 --retry-connrefused --retry-delay 1 --fail --silent --output /dev/null https://localhost:5173/
          BASE_URL=https://localhost:5173/ LIVE_REVIEWER_PASSWORD="$LOCAL_REVIEWER_PASSWORD" npm run test:browser:live
          BASE_URL=https://localhost:5173/ npm run test:browser:live:account
