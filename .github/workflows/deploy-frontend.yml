name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Test prototype behavior
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install browser for public-entry verification
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify public entry and page flows from production build
        working-directory: frontend
        run: |
          mkdir -p "$RUNNER_TEMP/public-portal"
          ln -s "$GITHUB_WORKSPACE/frontend/dist" "$RUNNER_TEMP/public-portal/codex-xk-rotaract"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/public-portal" > "$RUNNER_TEMP/public-portal.log" 2>&1 &
          portal_preview_pid=$!
          trap 'kill "$portal_preview_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent --output /dev/null http://127.0.0.1:4173/codex-xk-rotaract/
          BASE_URL=http://127.0.0.1:4173/codex-xk-rotaract/ npm run test:browser:all
          BASE_URL=http://127.0.0.1:4173/codex-xk-rotaract/ npm run test:browser:phase2
          BASE_URL=http://127.0.0.1:4173/codex-xk-rotaract/ npm run test:browser:calendar
          BASE_URL=http://127.0.0.1:4173/codex-xk-rotaract/ npm run test:browser:organization-sync
      - name: Upload frontend only
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
