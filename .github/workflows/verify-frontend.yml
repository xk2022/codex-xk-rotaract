name: Verify frontend

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit all locked frontend dependencies
        id: dependency-audit
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit-dependencies.mjs
      - name: Verify frontend dependency audit reports
        if: ${{ !cancelled() && steps.dependency-audit.outcome == 'success' }}
        run: |
          test -s target/dependency-audit/audit.json
          test -s target/dependency-audit/scan-metadata.json
          test -s target/dependency-audit/summary.md
      - name: Upload frontend dependency audit report or diagnostics
        if: ${{ !cancelled() && steps.dependency-audit.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dependency-audit-${{ github.run_attempt }}
          path: frontend/target/dependency-audit
          if-no-files-found: error
          retention-days: 7
      - name: Lint frontend source
        run: npm run lint
      - name: Run frontend tests with coverage
        run: npm run test:coverage
      - name: Type-check and build frontend
        run: npm run build
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage-${{ github.run_attempt }}
          path: frontend/coverage
          if-no-files-found: error
          retention-days: 7
