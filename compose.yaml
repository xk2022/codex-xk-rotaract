name: xk-rotaract-local

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: xk_rotaract
      POSTGRES_USER: xk_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xk_local -d xk_rotaract"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reserved for the later password-recovery/outbox slice; this slice sends no mail.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
